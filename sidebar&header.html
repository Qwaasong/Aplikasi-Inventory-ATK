<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sidebar with Gaps</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-gray-100 text-gray-800">

    <!-- HEADER -->
    <header class="h-16 w-full bg-[#f0f0f0] border-b border-gray-300 flex items-center justify-between px-4 sm:px-6 shrink-0 z-20">
        <div class="flex items-center gap-4">
            <button id="toggleBtn" class="p-1 rounded-md hover:bg-gray-200 focus:outline-none transition-colors">
                <i class="ph ph-list text-3xl font-bold text-black"></i>
            </button>
            <div class="text-3xl font-medium tracking-tight text-black select-none">V</div>
        </div>
        <div class="flex items-center">
            <button class="relative inline-flex items-center h-7 rounded-full w-12 border border-black bg-transparent focus:outline-none">
                <span class="translate-x-6 inline-block w-5 h-5 transform bg-transparent rounded-full transition-transform items-center justify-center flex">
                    <i class="ph ph-moon text-lg text-black"></i>
                </span>
            </button>
        </div>
    </header>

    <!-- WRAPPER -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="flex flex-col justify-between h-full bg-[#f0f0f0] w-64 transition-[width] duration-300 ease-in-out border-r border-gray-300 overflow-y-auto overflow-x-hidden">
            
            <!-- 
                NAV CONTAINER 
                Note: px-3 SELALU ada (gap kiri kanan tetap terjaga)
            -->
            <nav class="pt-4 px-3 space-y-2">
                
                <!-- Nav Item -->
                <a href="#" class="nav-item group flex items-center justify-start pl-3 pr-3 py-3 text-gray-900 bg-gray-300/60 rounded-lg transition-all duration-200 w-full">
                    <i class="ph ph-house text-2xl shrink-0"></i> 
                    <span class="ml-3 whitespace-nowrap font-medium sidebar-text transition-opacity duration-200">Dashboard</span>
                </a>

                <a href="#" class="nav-item group flex items-center justify-start pl-3 pr-3 py-3 text-gray-700 hover:bg-gray-200/80 rounded-lg transition-all duration-200 w-full">
                    <i class="ph ph-package text-2xl shrink-0"></i>
                    <span class="ml-3 whitespace-nowrap font-medium sidebar-text transition-opacity duration-200">Barang</span>
                </a>

                <a href="#" class="nav-item group flex items-center justify-start pl-3 pr-3 py-3 text-gray-700 hover:bg-gray-200/80 rounded-lg transition-all duration-200 w-full">
                    <i class="ph ph-user text-2xl shrink-0"></i>
                    <span class="ml-3 whitespace-nowrap font-medium sidebar-text transition-opacity duration-200">User</span>
                </a>
            </nav>

            <!-- Logout -->
            <div class="p-3 mb-2">
                <a href="#" class="nav-item group flex items-center justify-start pl-3 pr-3 py-3 text-gray-700 hover:bg-gray-200/80 rounded-lg transition-all duration-200 w-full">
                    <i class="ph ph-sign-out text-2xl shrink-0 rotate-180"></i>
                    <span class="ml-3 whitespace-nowrap font-medium sidebar-text transition-opacity duration-200">Logout</span>
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 h-full overflow-y-auto bg-white p-6 relative w-full">
            <div class="border-2 border-dashed border-gray-200 rounded-lg h-[150vh] flex flex-col items-center justify-start pt-10 text-gray-400">
                <p>Main Content Area</p>
            </div>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebarTexts = document.querySelectorAll('.sidebar-text');
        const navItems = document.querySelectorAll('.nav-item');
        
        // Kita tidak perlu lagi memilih navContainer untuk diubah paddingnya,
        // karena padding container (px-3) dibiarkan statis.
        
        let isExpanded = true;
        let isAnimating = false;

        toggleBtn.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            isExpanded = !isExpanded;

            if (!isExpanded) {
                // === MENUTUP ===
                // 1. Hide Text
                sidebarTexts.forEach(text => {
                    text.classList.add('opacity-0');
                    text.classList.add('hidden');
                });

                // 2. Kecilkan Sidebar
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');

                // 3. Tunggu sidebar mengecil, baru geser Icon ke tengah (padding)
                setTimeout(() => {
                    navItems.forEach(item => {
                        item.classList.remove('pl-3'); 
                        // pl-4 (16px) adalah center baru karena item width = 56px (80 - 24)
                        item.classList.add('pl-4', 'pr-0'); 
                    });
                    isAnimating = false;
                }, 300);

            } else {
                // === MEMBUKA ===
                // 1. Geser Icon ke Kiri dulu
                navItems.forEach(item => {
                    item.classList.remove('pl-4', 'pr-0');
                    item.classList.add('pl-3'); // Kembali ke padding standar
                });
                
                // 2. Tunggu icon geser, baru lebarkan sidebar
                setTimeout(() => {
                    sidebar.classList.remove('w-20');
                    sidebar.classList.add('w-64');

                    // 3. Munculkan teks
                    setTimeout(() => {
                        sidebarTexts.forEach(text => {
                            text.classList.remove('hidden');
                            requestAnimationFrame(() => {
                                text.classList.remove('opacity-0');
                            });
                        });
                        isAnimating = false;
                    }, 150);
                }, 200);
            }
        });

        // Responsif Init
        function checkScreenSize() {
            if (window.innerWidth < 768) {
                isExpanded = false;
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                
                // Set state tertutup (pl-4)
                navItems.forEach(item => { 
                    item.classList.remove('pl-3'); 
                    item.classList.add('pl-4', 'pr-0'); 
                });
                sidebarTexts.forEach(text => { text.classList.add('opacity-0', 'hidden'); });
            }
        }
        checkScreenSize();
    </script>
</body>
</html>
